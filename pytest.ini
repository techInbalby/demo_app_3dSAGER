[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers — used to slice the suite by speed / dependencies.
markers =
    unit: pure-Python helper tests (fast, no I/O)
    api: Flask route tests via the test client (no Celery worker, no Redis)
    integration: tests that exercise the live pipeline against the locked inputs (slow, ~30s)
    ui: Playwright browser tests against a running demo (slow, requires `docker compose up -d`)

# Default: run everything EXCEPT slow integration + ui tests. Opt-in with -m.
addopts = -ra --strict-markers -m "not integration and not ui"

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
